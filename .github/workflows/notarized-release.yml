name: Build signed and notarized PrintPDF

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type NOTARIZE to build, sign and submit PrintPDF to Apple'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notarize:
    if: ${{ inputs.confirmation == 'NOTARIZE' }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create temporary signing keychain
        env:
          APPLICATION_CERTIFICATE_BASE64: ${{ secrets.APPLICATION_CERTIFICATE_BASE64 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.APPLICATION_P12_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.INSTALLER_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APPLICATION_CERTIFICATE_PATH="$RUNNER_TEMP/printpdf-application.p12"
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/printpdf-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/printpdf-signing.keychain-db"

          echo -n "$APPLICATION_CERTIFICATE_BASE64" | base64 --decode -o "$APPLICATION_CERTIFICATE_PATH"
          echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$INSTALLER_CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$APPLICATION_CERTIFICATE_PATH" -P "$APPLICATION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERTIFICATE_PATH" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "#### available code signing identities"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "#### available installer certificates"
          security find-certificate -a -c "Developer ID Installer" "$KEYCHAIN_PATH"

      - name: Build, sign, notarize and staple
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash build/notarize-release.sh

      - name: Upload notarized installer
        uses: actions/upload-artifact@v4
        with:
          name: PrintPDF-notarized
          path: |
            PrintPDF.pkg
            PrintPDF-SHA256.txt
          if-no-files-found: error
          retention-days: 14
